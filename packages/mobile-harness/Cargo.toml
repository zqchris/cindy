[package]
name = "cindy-mobile-harness"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Durable, capability-based agent kernel for Cindy Mobile"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cap-std = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
